backend:
  name: github
  repo: ismailipek11/sabah-ezgi-site
  branch: main
  base_url: https://sabahezgitiryaki.com
  auth_endpoint: api/auth

media_folder: "images/blog"
public_folder: "/images/blog"

locale: tr

collections:
  - name: "blog"
    label: "Blog Yazıları"
    label_singular: "Blog Yazısı"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { label: "Yayın Tarihi", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Kategori", name: "category", widget: "select",
          options: ["Çalışma Teknikleri", "Sınav Stratejisi", "Motivasyon", "NLP & Hafıza", "Zaman Yönetimi", "Koçluk İpuçları"] }
      - { label: "Özet", name: "excerpt", widget: "text" }
      - { label: "Kapak Görseli", name: "thumbnail", widget: "image", required: false }
      - { label: "Okuma Süresi (dk)", name: "readtime", widget: "number", default: 5 }
      - { label: "İçerik", name: "body", widget: "markdown" }
