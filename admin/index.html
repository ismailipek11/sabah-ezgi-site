<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin — Sabah Ezgi Tiryaki</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#06275c;--gold:#C9A96E;--bg:#F9F8F6;--border:#e2e6ed;--text:#1a1a2e;--muted:#5a6275;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

    /* Login */
    #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);}
    .login-box{background:white;border-radius:16px;padding:2.5rem;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,.25);}
    .login-logo{height:40px;margin-bottom:1.5rem;}
    .login-box h2{font-size:1.25rem;color:var(--navy);margin-bottom:.25rem;}
    .login-box p{font-size:.875rem;color:var(--muted);margin-bottom:1.5rem;}
    .login-box input{width:100%;padding:.75rem 1rem;border:1.5px solid var(--border);border-radius:8px;font-size:.9375rem;margin-bottom:1rem;outline:none;font-family:inherit;}
    .login-box input:focus{border-color:var(--gold);}
    .btn-login{width:100%;padding:.875rem;background:var(--gold);color:var(--navy);border:none;border-radius:8px;font-size:.9375rem;font-weight:600;cursor:pointer;}
    .login-err{color:#dc2626;font-size:.875rem;margin-top:.75rem;display:none;}

    /* Nav */
    #admin-screen{display:none;}
    .admin-nav{background:var(--navy);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
    .admin-nav img{height:36px;filter:brightness(0) invert(1);}
    .admin-nav button{font-size:.8125rem;color:rgba(255,255,255,.7);background:none;border:1px solid rgba(255,255,255,.2);padding:.3rem .9rem;border-radius:20px;cursor:pointer;}

    /* Tabs */
    .tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:2rem;}
    .tab{padding:.75rem 1.5rem;font-size:.9375rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;}
    .tab.active{color:var(--navy);border-bottom-color:var(--gold);}

    .admin-body{max-width:860px;margin:2rem auto;padding:0 1.5rem 4rem;}
    .page{display:none;} .page.active{display:block;}

    /* Cards */
    .card{background:white;border-radius:12px;padding:2rem;box-shadow:0 2px 12px rgba(6,39,92,.08);margin-bottom:1.25rem;}
    .fg{margin-bottom:1.25rem;}
    .fg label{display:block;font-size:.875rem;font-weight:500;margin-bottom:.4rem;}
    .fg input,.fg select,.fg textarea{width:100%;padding:.7rem 1rem;border:1.5px solid var(--border);border-radius:8px;font-size:.9375rem;font-family:inherit;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s;}
    .fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold);background:white;}
    .fg textarea{resize:vertical;min-height:340px;font-size:.875rem;line-height:1.75;}
    .row-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
    .md-hint{background:rgba(201,169,110,.1);border-left:3px solid var(--gold);padding:.75rem 1rem;border-radius:0 8px 8px 0;font-size:.8125rem;color:var(--muted);margin-bottom:1.25rem;line-height:1.7;}
    .btn-pub{background:var(--navy);color:white;border:none;padding:.875rem 2.5rem;border-radius:30px;font-size:.9375rem;font-weight:600;cursor:pointer;}
    .btn-pub:hover{opacity:.9;}
    .btn-pub:disabled{opacity:.5;cursor:default;}
    #result,#result2{margin-top:1.25rem;padding:1rem 1.25rem;border-radius:8px;font-size:.9rem;display:none;}
    .ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;}
    .err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}

    /* Post list */
    .post-item{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border:1px solid var(--border);border-radius:10px;margin-bottom:.75rem;background:white;}
    .post-item:hover{border-color:var(--gold);}
    .post-name{font-size:.875rem;color:var(--text);font-weight:500;}
    .post-date{font-size:.75rem;color:var(--muted);margin-top:2px;}
    .post-actions{display:flex;gap:.5rem;}
    .btn-edit{padding:.4rem .9rem;background:var(--navy);color:white;border:none;border-radius:6px;font-size:.8rem;cursor:pointer;}
    .btn-del{padding:.4rem .9rem;background:#fee2e2;color:#991b1b;border:none;border-radius:6px;font-size:.8rem;cursor:pointer;}
    .empty{text-align:center;padding:3rem;color:var(--muted);}
    .loading{text-align:center;padding:2rem;color:var(--muted);}

    /* Edit modal */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:1rem;}
    .modal-bg.open{display:flex;}
    .modal{background:white;border-radius:16px;padding:2rem;width:100%;max-width:820px;max-height:90vh;overflow-y:auto;}
    .modal h3{font-size:1.125rem;color:var(--navy);margin-bottom:1.25rem;}
    .modal-actions{display:flex;gap:1rem;margin-top:1.25rem;}
    .btn-cancel{padding:.75rem 1.5rem;background:var(--bg);color:var(--muted);border:1px solid var(--border);border-radius:30px;font-size:.9375rem;cursor:pointer;}
  </style>
</head>
<body>

<!-- GİRİŞ -->
<div id="login-screen">
  <div class="login-box">
    <img class="login-logo" src="../images/logo.svg" alt="Logo">
    <h2>İçerik Paneli</h2>
    <p>Blog yazısı eklemek için giriş yapın.</p>
    <input type="password" id="pwd" placeholder="Şifre" autocomplete="current-password">
    <button class="btn-login" onclick="login()">Giriş Yap</button>
    <div class="login-err" id="login-err">Yanlış şifre, tekrar deneyin.</div>
  </div>
</div>

<!-- ADMİN -->
<div id="admin-screen">
  <nav class="admin-nav">
    <img src="../images/logo.svg" alt="Logo">
    <button onclick="logout()">Çıkış Yap</button>
  </nav>
  <div class="admin-body">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('new',this)">✏️ Yeni Yazı</div>
      <div class="tab" onclick="switchTab('list',this);loadPosts()">📋 Mevcut Yazılar</div>
    </div>

    <!-- YENİ YAZI -->
    <div class="page active" id="page-new">
      <div class="card">
        <div class="fg"><label>Başlık *</label><input type="text" id="title" placeholder="Yazının başlığı"></div>
        <div class="row-2">
          <div class="fg"><label>Kategori</label>
            <select id="category">
              <option>Çalışma Teknikleri</option><option>Sınav Stratejisi</option>
              <option>Motivasyon</option><option>NLP & Hafıza</option>
              <option>Zaman Yönetimi</option><option>Koçluk İpuçları</option>
            </select>
          </div>
          <div class="fg"><label>Okuma Süresi (dk)</label><input type="number" id="readtime" value="5" min="1" max="60"></div>
        </div>
        <div class="fg"><label>Özet</label><input type="text" id="excerpt" placeholder="2-3 cümlelik kısa özet"></div>
        <div class="md-hint">✍️ <strong>Markdown:</strong> <code>**kalın**</code> · <code>*italik*</code> · <code># Başlık</code> · <code>## Alt Başlık</code> · Boş satır = paragraf</div>
        <div class="fg"><label>İçerik *</label><textarea id="body" placeholder="Yazınızı buraya yazın..."></textarea></div>
        <button class="btn-pub" id="pub-btn" onclick="publish()">Yayınla →</button>
        <div id="result"></div>
      </div>
    </div>

    <!-- MEVCUT YAZILAR -->
    <div class="page" id="page-list">
      <div id="posts-list"><div class="loading">Yazılar yükleniyor…</div></div>
      <div id="result2"></div>
    </div>
  </div>
</div>

<!-- DÜZENLEME MODAL -->
<div class="modal-bg" id="edit-modal">
  <div class="modal">
    <h3>Yazıyı Düzenle</h3>
    <div class="fg"><label>Başlık *</label><input type="text" id="e-title"></div>
    <div class="row-2">
      <div class="fg"><label>Kategori</label>
        <select id="e-category">
          <option>Çalışma Teknikleri</option><option>Sınav Stratejisi</option>
          <option>Motivasyon</option><option>NLP & Hafıza</option>
          <option>Zaman Yönetimi</option><option>Koçluk İpuçları</option>
        </select>
      </div>
      <div class="fg"><label>Okuma Süresi (dk)</label><input type="number" id="e-readtime" value="5" min="1" max="60"></div>
    </div>
    <div class="fg"><label>Özet</label><input type="text" id="e-excerpt"></div>
    <div class="fg"><label>İçerik *</label><textarea id="e-body" style="min-height:280px"></textarea></div>
    <div class="modal-actions">
      <button class="btn-pub" onclick="saveEdit()">Kaydet</button>
      <button class="btn-cancel" onclick="closeModal()">İptal</button>
    </div>
    <div id="edit-result" style="margin-top:1rem;display:none;"></div>
  </div>
</div>

<script>
let pwd='';
let editFile='',editSha='';

// Giriş
async function login(){
  const input=document.getElementById('pwd').value;
  const err=document.getElementById('login-err');
  err.style.display='none';
  const res=await api({action:'login',password:input});
  if(res.ok){pwd=input;sessionStorage.setItem('cms_pwd',pwd);showAdmin();}
  else{err.style.display='block';}
}
function logout(){sessionStorage.removeItem('cms_pwd');location.reload();}
function showAdmin(){document.getElementById('login-screen').style.display='none';document.getElementById('admin-screen').style.display='block';}
document.getElementById('pwd').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
const saved=sessionStorage.getItem('cms_pwd');
if(saved){pwd=saved;showAdmin();}

// Sekme
function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('page-'+name).classList.add('active');
}

// Yazıları listele
async function loadPosts(){
  const el=document.getElementById('posts-list');
  el.innerHTML='<div class="loading">Yükleniyor…</div>';
  const res=await api({action:'list',password:pwd});
  if(!res.files||res.files.length===0){el.innerHTML='<div class="empty">Henüz blog yazısı yok.</div>';return;}
  el.innerHTML=res.files.reverse().map(f=>{
    const date=f.name.slice(0,10);
    const name=f.name.slice(11).replace(/-/g,' ').replace('.md','');
    return `<div class="post-item">
      <div><div class="post-name">${name}</div><div class="post-date">${date}</div></div>
      <div class="post-actions">
        <button class="btn-edit" onclick="openEdit('${f.name}','${f.sha}')">Düzenle</button>
        <button class="btn-del" onclick="deletePost('${f.name}','${f.sha}')">Sil</button>
      </div>
    </div>`;
  }).join('');
}

// Düzenleme modalı aç
async function openEdit(fname,sha){
  editFile=fname; editSha=sha;
  const res=await api({action:'get',password:pwd,filename:fname});
  if(!res.ok){alert('Yüklenemedi');return;}
  // Frontmatter parse
  const lines=res.content.split('\n');
  let inFm=false,fm={},bodyLines=[];
  let fmDone=false,fmCount=0;
  for(const l of lines){
    if(l==='---'&&!fmDone){fmCount++;if(fmCount===1){inFm=true;continue;}if(fmCount===2){inFm=false;fmDone=true;continue;}}
    if(inFm){const[k,...v]=l.split(':');fm[k.trim()]=v.join(':').trim().replace(/^"|"$/g,'');}
    else if(fmDone){bodyLines.push(l);}
  }
  document.getElementById('e-title').value=fm.title||'';
  document.getElementById('e-excerpt').value=fm.excerpt||'';
  document.getElementById('e-readtime').value=fm.readtime||5;
  document.getElementById('e-body').value=bodyLines.join('\n').trim();
  // Kategori seç
  const sel=document.getElementById('e-category');
  for(let o of sel.options){if(o.value===fm.category){o.selected=true;break;}}
  document.getElementById('edit-result').style.display='none';
  document.getElementById('edit-modal').classList.add('open');
}
function closeModal(){document.getElementById('edit-modal').classList.remove('open');}

// Kaydet
async function saveEdit(){
  const post={
    title:document.getElementById('e-title').value.trim(),
    category:document.getElementById('e-category').value,
    excerpt:document.getElementById('e-excerpt').value.trim(),
    readtime:document.getElementById('e-readtime').value,
    body:document.getElementById('e-body').value.trim(),
    sha:editSha
  };
  if(!post.title||!post.body){alert('Başlık ve içerik zorunludur.');return;}
  const res=await api({action:'update',password:pwd,post,filename:editFile});
  const el=document.getElementById('edit-result');
  el.style.display='block';
  if(res.ok){el.className='ok';el.textContent='✓ Kaydedildi! Site güncelleniyor…';setTimeout(()=>{closeModal();loadPosts();},1500);}
  else{el.className='err';el.textContent='Hata: '+(res.error||'Bilinmeyen hata');}
}

// Sil
async function deletePost(fname,sha){
  if(!confirm(fname+' silinsin mi?'))return;
  const res=await api({action:'delete',password:pwd,filename:fname,post:{sha}});
  const el=document.getElementById('result2');
  el.style.display='block';
  if(res.ok){el.className='ok';el.textContent='✓ Silindi.';loadPosts();}
  else{el.className='err';el.textContent='Hata: '+(res.error||'Silinemedi');}
}

// Yeni yayınla
async function publish(){
  const title=document.getElementById('title').value.trim();
  const body=document.getElementById('body').value.trim();
  const result=document.getElementById('result');
  const btn=document.getElementById('pub-btn');
  if(!title||!body){result.className='err';result.style.display='block';result.textContent='Başlık ve içerik zorunludur.';return;}
  btn.disabled=true;btn.textContent='Yayınlanıyor…';result.style.display='none';
  const res=await api({action:'publish',password:pwd,post:{title,body,category:document.getElementById('category').value,excerpt:document.getElementById('excerpt').value.trim(),readtime:document.getElementById('readtime').value}});
  btn.disabled=false;btn.textContent='Yayınla →';
  if(res.ok){result.className='ok';result.style.display='block';result.textContent='✓ "'+title+'" yayınlandı! Site birkaç dakika içinde güncellenir.';document.getElementById('title').value='';document.getElementById('body').value='';document.getElementById('excerpt').value='';}
  else{result.className='err';result.style.display='block';result.textContent='Hata: '+(res.error||'Bilinmeyen hata');}
}

// API yardımcısı
async function api(body){
  try{
    const r=await fetch('/api/cms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    return await r.json();
  }catch(e){return{ok:false,error:e.message};}
}
</script>
</body>
</html>
